<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <!-- `viewport-fit=cover` lässt die Seite bis unter den iPhone-Balken
         reichen — das Dock hält sich den Streifen selbst frei
         (`env(safe-area-inset-bottom)` in der Stildatei, seit v0.113). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Blunderluck</title>

    <!-- Zeichen der App. Das SVG nehmen moderne Browser, das PNG die älteren;
         der Startbildschirm von iPhone und iPad braucht zwingend PNG.
         Erzeugt aus icon.svg mit tools\Icons-Erzeugen.ps1. -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1f5fa8">
    <meta name="apple-mobile-web-app-title" content="Blunderluck">

    <link rel="stylesheet" href="css/stil.css">
</head>
<body>

    <!--
        DER KOPFBALKEN IST SEIT v0.25.0 GANZ WEG (Nutzer-Ansage 24.08.:
        „die version und der wunsch knopf oben raus und auch in die
        einstellungen verschieben, damit mehr Platz für das Wichtige ist").
        Vorher zogen dort schon der Stand des Abgleichs (v0.15.0) und der
        Schriftzug (v0.16.0) aus.

        Die Überschrift BLEIBT — unsichtbar: Vorleseprogramme brauchen eine
        Seiten-Überschrift, und der Name der App wird an dieser Stelle
        geprüft (tests\test-syntax.js).
    -->
    <h1 class="nur-vorlesen">Blunderluck</h1>

    <p class="hinweis" id="hinweis" hidden></p>

    <nav class="tab-leiste" id="tab-leiste" role="tablist"></nav>

    <main class="tab-inhalt" id="tab-inhalt"></main>

    <!-- Das Anmelde-Vollbild (js/anmeldung.js, seit v0.8.0): sichtbar nur,
         solange auf diesem Gerät niemand angemeldet ist. Es liegt über der
         ganzen App; nur die Dialoge liegen noch darüber. -->
    <div class="anmeldung-vollbild" id="anmeldung" hidden></div>

    <div class="dialog-hintergrund" id="dialog" hidden></div>

    <!-- Reihenfolge zählt: erst Einstellungen und Datenlogik, dann die
         Bausteine, zuletzt der Startpunkt. -->
    <script src="js/konfig.js"></script>
    <script src="js/spieler.js"></script>
    <script src="js/versiegelung.js"></script>
    <script src="js/ich.js"></script>
    <script src="js/verwaltung.js"></script>
    <script src="js/speicher.js"></script>
    <script src="js/abgleich.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/anmeldung.js"></script>
    <script src="js/schach-varianten.js"></script>
    <script src="js/schach.js"></script>
    <script src="js/schach-runde.js"></script>
    <script src="js/schach-tafel.js"></script>
    <!-- Die Bildanleitung rechnet mit den Regeln oben und muss deshalb nach
         ihnen stehen. -->
    <script src="js/schach-vorschau.js"></script>
    <!-- Die Schachregel-Anleitung rechnet ihre Bilder ebenfalls mit den echten
         Regeln und braucht SCHACH und SCHACH_RUNDE vor sich. -->
    <script src="js/schach-grundlagen.js"></script>
    <!-- Die drei folgenden Dateien ergänzen TEAM_SCHACH und müssen NACH ihm
         geladen werden (siehe Kopf von team-schach.js). -->
    <script src="js/team-schach.js"></script>
    <script src="js/team-schach-uebersicht.js"></script>
    <script src="js/team-schach-brett.js"></script>
    <script src="js/team-schach-auswertung.js"></script>
    <script src="js/team-schach-grundlagen.js"></script>
    <script src="js/rangliste.js"></script>
    <!-- Startbildschirm und Fähigkeiten-Tab (seit v0.9.0) — sie rufen zur
         Laufzeit Bausteine von TEAM_SCHACH und stehen deshalb dahinter.
         Die Freundesliste (v0.11.0) hängt auf dem Zwischenbildschirm. -->
    <script src="js/start.js"></script>
    <script src="js/faehigkeiten.js"></script>
    <script src="js/freunde.js"></script>
    <script src="js/einstellungen.js"></script>
    <script src="js/wunsch.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
