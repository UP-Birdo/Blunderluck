    <!-- DIE SPERRE IM BROWSER (seit v0.137.0, Sicherheits-Runde 25.09.2026):
         Skripte nur aus diesem Projekt (dazu genau ZWEI eingebettete Blöcke,
         die Import-Karte des 3D-Bretts und seit v0.151.5 der Notfall-Weg,
         jeder über seinen Fingerabdruck), keine
         Plugins, keine fremden Formulare, Verbindungen nur zur eigenen Seite
         und zur Datenbank. Wer die Import-Karte oder die Datenbank-Adresse
         ändert, zieht diese Zeile mit — tests\test-sicherheit.js prüft beides.
         Seit v0.138.0 (UPCrew-Umzug): die UPCrew-Datenbank, die Anmeldung bei
         Firebase (identitytoolkit, securetoken) und — nur bis sie gelöscht
         ist — die ALTE Blunderluck-Datenbank für den Konto-Umzug. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-3IBak4uiv4l6wKD16ssX6AlPnBMuJNftin3Hcb/KpfM=' 'sha256-oxRg/sNlGFm2CISZo9GHUark3HgJe5G+qg99yVN1778='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob: https://upcrew-7a29d-default-rtdb.europe-west1.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://blunderluck-8b7f0-default-rtdb.europe-west1.firebasedatabase.app; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <!-- DER NOTFALL-WEG (seit v0.151.5) — steht bewusst ganz oben und direkt
         in der Seite, damit er auch läuft, wenn keine einzige andere Datei
         ankommt (Typoluck hatte am 27.09.2026 am iPhone eine weisse Seite:
         kein Stil, kein Skript; docs\entscheidungen\erkenntnisse.md). Nach
         10 s prüft er: Hat js\app.js gestartet (window.BLUNDERLUCK_GESTARTET)
         und gilt der Stil (--leiste-hoehe aus css\stil.css)? Seit v0.164.0
         rettet er erst, wenn das Dokument FERTIG geladen ist
         (document.readyState "complete") — solange noch geladen wird (erster
         Besuch über langsames Netz: das Laden allein dauert länger als 10 s),
         sieht er jede Sekunde wieder nach, insgesamt höchstens 30 s; dann
         gilt die Rettung in jedem Fall. Wenn nicht gestartet oder ohne Stil:
         EINMAL den Service Worker dieses Ordners abmelden, NUR die
         blunderluck-Zwischenspeicher leeren und neu laden. Merker in
         sessionStorage — höchstens einmal in fünf Minuten, danach nur ein
         schlichter Link „Neu laden". Die CSP oben erlaubt diesen Block über
         seinen Fingerabdruck (sha256) — WER EIN ZEICHEN DARIN ÄNDERT, ZIEHT
         DEN FINGERABDRUCK MIT, sonst blockiert die CSP genau den Notfall-Weg
         (tests\test-sicherheit.js und test-notfall.js prüfen es). -->
    <script id="notfall">
        (function () {
            var MERKER = "blunderluck.notfall";
            var WARTEN_MS = 10000;
            var HOECHSTENS_MS = 30000;
            var SCHRITT_MS = 1000;
            var SPERRE_MS = 5 * 60 * 1000;

            function stilDa() {
                try {
                    return getComputedStyle(document.documentElement).getPropertyValue("--leiste-hoehe").trim() !== "";
                } catch (fehler) {
                    return true;
                }
            }

            function linkZeigen() {
                if (!document.body || document.getElementById("notfall-link")) {
                    return;
                }
                var link = document.createElement("a");
                link.id = "notfall-link";
                link.href = "./";
                link.textContent = "Neu laden";
                link.style.cssText = "display:block;margin:24px;font:600 18px sans-serif";
                document.body.appendChild(link);
            }

            function retten() {
                try {
                    var zuletzt = Number(window.sessionStorage.getItem(MERKER));
                    if (zuletzt && Date.now() - zuletzt < SPERRE_MS) {
                        linkZeigen();
                        return;
                    }
                    window.sessionStorage.setItem(MERKER, String(Date.now()));
                } catch (fehler) {
                    linkZeigen();
                    return;
                }
                var ordner = new URL("./", window.location.href).href;
                var arbeit = [];
                if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                    arbeit.push(navigator.serviceWorker.getRegistrations().then(function (liste) {
                        return Promise.all(liste.filter(function (r) {
                            return r.scope === ordner;
                        }).map(function (r) {
                            return r.unregister();
                        }));
                    }));
                }
                if (window.caches && window.caches.keys) {
                    arbeit.push(window.caches.keys().then(function (namen) {
                        return Promise.all(namen.filter(function (name) {
                            return name.indexOf("blunderluck-") === 0;
                        }).map(function (name) {
                            return window.caches.delete(name);
                        }));
                    }));
                }
                Promise.all(arbeit).catch(function () {
                    return null;
                }).then(function () {
                    window.location.reload();
                });
            }

            var gewartet = WARTEN_MS;

            function pruefen() {
                if (window.BLUNDERLUCK_GESTARTET === true && stilDa()) {
                    return;
                }
                if (document.readyState !== "complete" && gewartet < HOECHSTENS_MS) {
                    gewartet += SCHRITT_MS;
                    setTimeout(pruefen, SCHRITT_MS);
                    return;
                }
                retten();
            }

            window.BLUNDERLUCK_NOTFALL = { retten: retten, stilDa: stilDa };
            setTimeout(pruefen, WARTEN_MS);
        })();
    </script>
