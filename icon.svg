<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Quizz">
    <title>Quizz</title>

    <!--
        Das Zeichen der App: eine Würfelfläche mit vier Augen und einem Stern in
        der Mitte. Beides zusammen ist genau das Würfel Quizz — die Werte 1 bis 5
        und der Stern. Bewusst eine gezeichnete Form und kein Emoji (Haus-Regel).

        Quelle für alle Bildgrössen. Die PNG-Fassungen erzeugt
        tools\Icons-Erzeugen.ps1 aus denselben Koordinaten.
    -->

    <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#1f5fa8"/>
    <rect x="26" y="26" width="460" height="460" rx="74" ry="74"
          fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="10"/>

    <!--
        Die vier Augen sitzen weit aussen und der Stern bleibt klein: In der
        Grösse eines Lesezeichens (32 Pixel) verschmelzen sonst alle Formen zu
        einem Fleck. Wer die Werte ändert, prüft das Zeichen in 32 Pixel nach.
    -->
    <circle cx="142" cy="142" r="38" fill="#ffffff"/>
    <circle cx="370" cy="142" r="38" fill="#ffffff"/>
    <circle cx="142" cy="370" r="38" fill="#ffffff"/>
    <circle cx="370" cy="370" r="38" fill="#ffffff"/>

    <!-- Der Stern in der Mitte, fünfzackig. -->
    <polygon fill="#ffffff"
             points="256,185 274,234 326,237 286,269 299,319 256,290 213,319 226,269 186,237 238,234"/>
</svg>
